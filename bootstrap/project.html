<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jan16hcm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light pt-2">
    <nav
      class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-dark-subtle small "
    >
      <div class="container">
        <a href="#" class="navbar-brand">
          <img
            src="./assets/images/logo.svg"
            alt="githubLogo"
            width="40"
            height="30"
            class="d-inline-block align-text-top"
          />
          Jan16hcm
        </a>
        <button
          class="navbar-toggler ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarCollapse"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-collapse collapse" id="navbarCollapse">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a href="#" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">About</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Course</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">FAQ</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Blog</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Contact</a>
            </li>
          </ul>

          <div class="ms-auto me-1 d-md-block">
            <button type="button" class="btn btn-sm btn-danger d-inline-flex">
              <img
                src="./assets/images/personfill.svg"
                alt="personfill"
                width="20"
                height="20"
                class="d-inline-block align-text-bottom me-1"
              />
              <span>Sign-up for Free</span>
            </button>

            <button type="button" class="btn btn-sm btn-warning d-inline-flex">
              <img
                src="./assets/images/login.svg"
                alt="login"
                width="20"
                height="20"
                class="d-inline-block align-text-bottom"
              />
              <span>Login</span>
            </button>
          </div>

          <form action="">
            <div class="input-group">
                <input
                  type="search"
                  name="searchBar"
                  id="searchBar"
                  class="form-control"
                  placeholder="Search for..."
                />
                <button type="submit" class="btn btn-success">
                  <img
                    src="./assets/images/search.svg"
                    alt="search"
                    width="20"
                    height="20"
                    class="d-inline-block align-text-bottom"
                  />
                </button>
            </div>
          </form>
        </div>
      </div>
    </nav>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
