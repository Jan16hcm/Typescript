<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row">
        <div class="col-md-4">
          <div class="card">
            <img
              src="https://cf-courses-data.s3.us.cloud-object-storage.appdomain.cloud/zdabgP316w685n0T_wPqGg/C1.png"
              class="card-img-top"
              alt="Event Decor"
            />
            <div class="card-body">
              <h4 class="card-title">Event Decor</h4>
              <a href="#" class="card-text text-decoration-none btn btn-primary"
                >Read more</a
              >
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card">
            <img
              src="https://cf-courses-data.s3.us.cloud-object-storage.appdomain.cloud/Yq7tYF1aOJse6YgMs1PeBg/C2.png"
              class="card-img-top"
              alt="Music and Entertainment"
            />
            <div class="card-body">
              <h4 class="card-title">Music and Entertainment</h4>
              <a href="#" class="card-text text-decoration-none btn btn-primary"
                >Read more</a
              >
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card">
            <img
              src="https://cf-courses-data.s3.us.cloud-object-storage.appdomain.cloud/3vSyMU5LZPiCf7hJtNLuDw/C3.png"
              class="card-img-top"
              alt="Lighting Design"
            />
            <div class="card-body">
              <h4 class="card-title">Lighting Design</h4>
              <a href="#" class="card-text text-decoration-none btn btn-primary"
                >Read more</a
              >
            </div>
          </div>
        </div>

        <div class="d-flex col-12 justify-content-center mt-3">
          <button
            type="button"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modalDialog"
          >
            Contact Us
          </button>
        </div>

        <div class="modal fade" id="modalDialog" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Contact Us</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                ></button>
              </div>

              <div class="modal-body mb-3">
                <form action="" id="formModal">
                  <div class="mb-3">
                    <label for="recipientText" class="form-label"
                      >Recipient:</label
                    ><input
                      type="text"
                      name="recipientText"
                      id="recipientText"
                      class="form-control"
                    />
                  </div>

                  <div class="mb-3">
                    <label for="messageText" class="form-label">Message:</label
                    ><textarea
                      class="form-control"
                      name="messageText"
                      id="messageText"
                      rows="5"
                    ></textarea>
                  </div>

                  <div id="alertDiv">

                  </div>

                  <div class="modal-footer">
                    <div class="d-flex ms-auto gap-1">
                      <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                      >
                        Close
                      </button>
                      <button type="submit" class="btn btn-primary">
                        Send
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/main.js"></script>
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
