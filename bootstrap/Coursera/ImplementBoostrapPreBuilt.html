<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVENTURA</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <div class="navbar-brand"><span>EVENTURA</span></div>
        <button
          class="navbar-toggler"
          data-bs-target="#navbarCollapse"
          data-bs-toggle="collapse"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarCollapse">
          <ul class="navbar-nav">
            <li class="nav-item"><span class="nav-link active">Home</span></li>
            <li class="nav-item"><span class="nav-link">Services</span></li>
            <li class="nav-item"><span class="nav-link">Contact</span></li>
            <li class="nav-item">
              <span class="nav-link disabled">Bookings</span>
            </li>
          </ul>

          <div class="ms-auto">
            <form action="" class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                name="searchNavBar"
                id="searchNavBar"
                placeholder="Search"
              />
              <button type="submit" class="btn btn-outline-success">
                Search
              </button>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <section class="mb-4">
      <div class="container-fluid">
        <div class="carousel slide" id="carouselExample">
          <div class="carousel-indicators">
            <button
              type="button"
              class="active"
              data-bs-target="#carouselExample"
              data-bs-slide-to="0"
            ></button>
            <button
              type="button"
              class=""
              data-bs-target="#carouselExample"
              data-bs-slide-to="1"
            ></button>
            <button
              type="button"
              class=""
              data-bs-target="#carouselExample"
              data-bs-slide-to="2"
            ></button>
          </div>

          <div class="carousel-inner">
            <div class="carousel-item active">
              <img
                class="d-block w-100"
                src="https://as1.ftcdn.net/jpg/20/43/94/58/1000_F_2043945848_iDxrgyjy6TyHSt63cJFRp5lnwEYCzle9.webp"
                alt="img1"
              />
              <div class="carousel-caption d-none d-lg-block">
                <h5 class="text-white fw-bold">Cho doi khan</h5>
              </div>
            </div>
            <div class="carousel-item">
              <img
                src="https://as2.ftcdn.net/jpg/20/73/22/25/1000_F_2073222571_vtvcd1rWjHMFWjnlQgakzKkJ6LzVs3QC.webp"
                alt="img2"
                class="d-block w-100"
              />
              <div class="carousel-caption d-none d-lg-block">
                <h5 class="text-white fw-bold">2 con cho</h5>
              </div>
            </div>
            <div class="carousel-item">
              <img
                src="https://as1.ftcdn.net/jpg/20/73/22/78/1000_F_2073227866_sCowdwAvu2eXWcHpJuT3KFcdXorG9Aw1.webp"
                alt="img3"
                class="d-block w-100"
              />
              <div class="carousel-caption d-none d-lg-block">
                <h5 class="text-white fw-bold">Cho xem tivi</h5>
              </div>
            </div>
          </div>

          <button
            type="button"
            class="carousel-control-prev"
            data-bs-target="#carouselExample"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>
          </button>

          <button
            type="button"
            class="carousel-control-next"
            data-bs-target="#carouselExample"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="row">
          <div class="col-md-4 mb-4 mb-md-0">
            <div class="card">
              <img
                src="https://cf-courses-data.s3.us.cloud-object-storage.appdomain.cloud/zdabgP316w685n0T_wPqGg/C1.png"
                class="card-img-top"
                alt="Event Decor"
              />

              <div class="card-body">
                <h5 class="card-title">Event Decor</h5>
                <button type="button" class="btn btn-primary">Read more</button>
              </div>
            </div>
          </div>

          <div class="col-md-4 mb-4 mb-md-0">
            <div class="card">
              <img
                src="https://cf-courses-data.s3.us.cloud-object-storage.appdomain.cloud/Yq7tYF1aOJse6YgMs1PeBg/C2.png"
                class="card-img-top"
                alt="Music and Entertainment"
              />

              <div class="card-body">
                <h5 class="card-title">Music and Entertainment</h5>
                <button type="button" class="btn btn-primary">Read more</button>
              </div>
            </div>
          </div>

          <div class="col-md-4 mb-4 mb-md-0">
            <div class="card">
              <img
                src="https://cf-courses-data.s3.us.cloud-object-storage.appdomain.cloud/3vSyMU5LZPiCf7hJtNLuDw/C3.png"
                class="card-img-top"
                alt="Lighting Design"
              />
              <div class="card-body">
                <h5 class="card-title">Lighting Design</h5>
                <button type="button" class="btn btn-primary">Read more</button>
              </div>
            </div>
          </div>

          <div class="col-md-12 d-flex justify-content-center mt-3">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-target="#modalExample"
              data-bs-toggle="modal"
            >
              Contact Us
            </button>
          </div>
        </div>
        <div class="modal fade" id="modalExample" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Contact Us</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                ></button>
              </div>

              <form action="" id="formModal">
                <div class="modal-body mb-3">
                  <div class="mb-3">
                    <label for="recipientText" class="form-label"
                      >Recipient:</label
                    ><input
                      type="text"
                      name="recipientText"
                      id="recipientText"
                      class="form-control"
                    />
                  </div>

                  <div class="mb-3">
                    <label for="messageText" class="form-label">Message:</label
                    ><textarea
                      class="form-control"
                      name="messageText"
                      id="messageText"
                      rows="5"
                    ></textarea>
                  </div>

                  <div id="alertDiv"></div>
                </div>
                <div class="modal-footer">
                  <div class="d-flex ms-auto gap-1">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Close
                    </button>
                    <button type="submit" class="btn btn-primary">Send</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="./assets/main.js"></script>
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
