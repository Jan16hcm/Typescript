<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 2</title>
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-secondary-subtle py-3">
      <div class="container-fluid">
        <a class="navbar-brand ms-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            fill="currentColor"
            class="bi bi-github"
            viewBox="0 0 16 16"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"
            />
          </svg>
        </a>

        <button
          type="button"
          class="navbar-toggler border-0"
          data-bs-target="#navbarCollapse"
          data-bs-toggle="collapse"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-collapse collapse" id="navbarCollapse">
          <ul class="navbar-nav ms-3 mt-2 ms-lg-0 mt-lg-0">
            <li class="nav-item">
              <a href="#" class="nav-link active">Home</a>
            </li>
            <li class="nav-item"><a href="#" class="nav-link">About us</a></li>
            <li class="nav-item dropdown">
              <a
                href="#"
                class="nav-link dropdown-toggle"
                role="button"
                data-bs-toggle="dropdown"
                >Help</a
              >
              <ul class="dropdown-menu">
                <li class="dropdown-item">
                  <a href="#" class="nav-link">Bootstrap</a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li class="dropdown-item">
                  <a href="#" class="nav-link">Tailwind</a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li class="dropdown-item">
                  <a href="#" class="nav-link">React</a>
                </li>
              </ul>
            </li>
          </ul>

          <form action="" class="d-flex ms-auto mt-2 mt-lg-0" role="search">
            <input
              type="search"
              class="form-control me-2"
              name="search"
              id="search"
              placeholder="Search for.."
            />
            <button type="submit" class="btn btn-success">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <section class="mt-5">
      <div class="container">
        <form action="" class="" style="max-width: 50%">
          <div class="mb-4">
            <label class="form-label fw-bold" for="fullname">Full Name</label>
            <input
              type="text"
              class="form-control"
              name="fullname"
              id="fullname"
            />
          </div>

          <div class="mb-4">
            <label for="email" class="form-label fw-bold">Email address</label>
            <input type="email" class="form-control" name="email" id="email" />
            <p class="form-text">
              We'll never share your email with anyone else.
            </p>
          </div>

          <div class="d-flex align-items-center mb-4">
            <label for="selectForm" class="form-label fw-bold me-2 text-nowrap"
              >Reason for contacting us:</label
            >
            <select
              class="form-select w-auto"
              name="selectForm"
              id="selectForm"
            >
              <option value="Billing">Billing</option>
              <option value="Technical Support">Technical Support</option>
              <option value="Complaints and Feedback">
                Complaints and Feedback
              </option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" for="message">Comments</label>
            <textarea class="form-control" rows="8" name="message" id="message"></textarea>
          </div>

          <div class="">
            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
          </div>
        </form>
      </div>
    </section>
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
