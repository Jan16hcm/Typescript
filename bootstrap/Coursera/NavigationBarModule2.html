<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Bar Module 2</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-5 py-3">
      <div class="container-fluid">
        <div class="navbar-brand">EVENTURA</div>
        <button
          type="button"
          class="navbar-toggler"
          data-bs-target="#navbarCollapse"
          data-bs-toggle="collapse"
        >
          <span href="#" class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarCollapse">
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item">
              <a href="#" class="nav-link active">Home</a>
            </li>

            <li class="nav-item"><a href="#" class="nav-link">Services</a></li>

            <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>

            <li class="nav-item">
              <a href="#" class="nav-link disabled">Booking</a>
            </li>
          </ul>

          <form action="" role="search" class="d-flex ms-auto">
            <input
              type="search"
              name=""
              id=""
              class="form-control me-2"
              placeholder="Search..."
            /><button type="submit" class="btn btn-success d-none d-lg-block">
              Search
            </button>
            <button
              type="submit"
              class="btn btn-outline-success d-block d-lg-none"
            >
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container-fluid mb-4">
      <div class="carousel slide" id="carouselControl" data-bs-ride="carousel">
        <ol class="carousel-indicators list-unstyled">
          <li
            data-bs-target="#carouselControl"
            data-bs-slide-to="0"
            class="active"
          ></li>
          <li data-bs-target="#carouselControl" data-bs-slide-to="1"></li>
          <li data-bs-target="#carouselControl" data-bs-slide-to="2"></li>
        </ol>

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="https://cf-courses-data.s3.us.cloud-object-storage.appdomain.cloud/OM5-AjisaP143eE362lvFw/1.png"
              alt="img1"
              class="d-block w-100"
            />
            <div class="carousel-caption d-none d-lg-block">
              <h5>HeHe</h5>
            </div>
          </div>
          <div class="carousel-item">
            <img
              src="https://cf-courses-data.s3.us.cloud-object-storage.appdomain.cloud/lpYuxmA4zC9F4aG6RBkyrA/2.png"
              alt="img2"
              class="d-block w-100"
            />
            <div class="carousel-caption d-none d-lg-block">
              <h5>HiHi</h5>
            </div>
          </div>
          <div class="carousel-item">
            <img
              src="https://cf-courses-data.s3.us.cloud-object-storage.appdomain.cloud/MFCpEcnA6F-RQkrITCoxBA/3.png"
              alt="img3"
              class="d-block w-100"
            />
            <div class="carousel-caption d-none d-lg-block">
              <h5>HaHa</h5>
            </div>
          </div>
        </div>

        <button
          type="button"
          class="carousel-control-prev"
          data-bs-target="#carouselControl"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
          <span class="visually-hidden">Previous</span>
        </button>

        <button
          type="button"
          class="carousel-control-next"
          data-bs-target="#carouselControl"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <script src="./assets/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
