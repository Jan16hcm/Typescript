<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Bar Module 2</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <div class="navbar-brand">EVENTURA</div>

        </button>

        <div class="collapse navbar-collapse" id="navbarCollapse">
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item">
              <a href="#" class="nav-link active">Home</a>

            <li class="nav-item"><a href="#" class="nav-link">Services</a></li>

            <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>

            <li class="nav-item">
              <a href="#" class="nav-link disabled">Booking</a>
            </li>
          </ul>

          <form action="" role="search" class="d-flex ms-auto">
            <input
              type="search"
              name=""
              id=""
              class="form-control me-2"
              placeholder="Search..."
            /><button
              type="submit"
              class="btn btn-success d-sm-none d-lg-block"
            >
              Search
            </button>
            <button
              type="submit"
              class="btn btn-outline-success d-sm-block d-lg-none"
            >
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <script src="./assets/js/bootstrap.bundle.min.js"></script>
