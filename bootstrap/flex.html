<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
</head>
<body>
    <div class="d-flex p-2 bg-warning">
        <div class="border border-primary line1">line1</div>
        <div class="border border-primary line2">line2</div>
        <div class="border border-primary line3">line3</div>
        <div class="border border-primary line4">line4</div>
        <div class="border border-primary line5">line5</div>
    </div>

    <div class="d-sm-flex d-inline-flex p-2 bg-warning mb-3">
        <div class="border border-primary line1">line1</div>
        <div class="border border-primary line2">line2</div>
        <div class="border border-primary line3">line3</div>
        <div class="border border-primary line4">line4</div>
        <div class="border border-primary line5">line5</div>
    </div>

    <div class="d-flex flex-row mb-3 bg-danger-subtle py-2">
        <div class="border border-dark border-2 bg-primary-subtle p-2">Flex item 1</div>
        <div class="border border-dark border-2 bg-primary-subtle p-2">Flex item 2</div>
        <div class="border border-dark border-2 bg-primary-subtle p-2">Flex item 3</div>
    </div>

    <div class="d-flex flex-row-reverse border border-info-subtle bg-danger-subtle py-2 mb-3">
        <div class="border border-dark border-2 p-2">Flex item 1</div>
        <div class="border border-dark border-2 p-2">Flex item 2</div>
        <div class="border border-dark border-2 p-2">Flex item 3</div>
    </div>

    <div class="d-flex flex-column bg-info-subtle py-2 mb-3">
        <div class="p-2 border border-2 border-danger-subtle bg-warning-subtle">Flex item column 1</div>
        <div class="p-2 border border-2 border-danger-subtle bg-warning-subtle">Flex item column 2</div>
        <div class="p-2 border border-2 border-danger-subtle bg-warning-subtle">Flex item column 3</div>
    </div>
    <div class="d-flex flex-column-reverse bg-info-subtle py-2 mb-3">
        <div class="p-2 border border-2 border-danger-subtle bg-warning-subtle">Flex item column 1</div>
        <div class="p-2 border border-2 border-danger-subtle bg-warning-subtle">Flex item column 2</div>
        <div class="p-2 border border-2 border-danger-subtle bg-warning-subtle">Flex item column 3</div>
    </div>

</body>
</html>
