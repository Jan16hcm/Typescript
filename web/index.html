<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 bg-light mt-2 rounded shadow-sm">
        <h1 class="text-center">Login</h1>

        <form id="validForm" novalidate>
          <div class="mb-3">
            <label for="username" class="ms-1 mb-sm-1">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              placeholder="Enter your username"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="ms-1 mb-sm-1">Password</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control pe-5"
                id="password"
                placeholder="Enter your password"
                required
              />
              <button
                class="btn btn-outline-secondary bg-white"
                type="button"
                id="toggleBtn"
                style="color: #6c757d"
              >
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
          </div>

          <div class="mb-2 ms-2 invisible d-block" id="errorMessage" style="color:#dc3545">
            Username or password is incorrect. Please try again.
          </div>

          <div class="row justify-content-center mb-3">
            <button type="submit" class="col-8 btn btn-primary">Submit</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
