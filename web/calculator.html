<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

  <div class="card shadow p-2" style="width: 100%; max-width: 400px; height: 550px; background-color: gray;">
    
    <div class="d-flex flex-column justify-content-end text-end p-3 bg-dark text-white rounded border border-secondary mb-2" style="height: 100px;">
      <div class="fs-6 text-secondary text-truncate" id="subAnswer" style="min-height: 24px;"></div>
      <div class="fs-2 fw-bold text-truncate" id="answer">0</div>
    </div>

    <div class="row row-cols-4 g-2 flex-grow-1">
      <div class="col"><button class="btn btn-warning w-100 h-100" id="clearBtn">AC</button></div>
      <div class="col"><button class="btn btn-secondary w-100 h-100 operation" id="powerBtn">^</button></div>
      <div class="col"><button class="btn btn-secondary w-100 h-100 operation" id="remainerBtn">%</button></div>
      <div class="col"><button class="btn btn-secondary w-100 h-100 operation" id="dividedBtn">/</button></div>

      <div class="col"><button class="btn btn-light w-100 h-100 number">7</button></div>
      <div class="col"><button class="btn btn-light w-100 h-100 number">8</button></div>
      <div class="col"><button class="btn btn-light w-100 h-100 number">9</button></div>
      <div class="col"><button class="btn btn-secondary w-100 h-100 operation" id="multiplyBtn">*</button></div>

      <div class="col"><button class="btn btn-light w-100 h-100 number">4</button></div>
      <div class="col"><button class="btn btn-light w-100 h-100 number">5</button></div>
      <div class="col"><button class="btn btn-light w-100 h-100 number">6</button></div>
      <div class="col"><button class="btn btn-secondary w-100 h-100 operation" id="negativeBtn">-</button></div>

      <div class="col"><button class="btn btn-light w-100 h-100 number">1</button></div>
      <div class="col"><button class="btn btn-light w-100 h-100 number">2</button></div>
      <div class="col"><button class="btn btn-light w-100 h-100 number">3</button></div>
      <div class="col"><button class="btn btn-secondary w-100 h-100 operation" id="positiveBtn">+</button></div>

      <div class="col"><button class="btn btn-secondary w-100 h-100 number">0</button></div>
      <div class="col"><button class="btn btn-secondary w-100 h-100">.</button></div>
      <div class="col"><button class="btn btn-secondary w-100 h-100">ANS</button></div>
      <div class="col"><button class="btn btn-secondary w-100 h-100 operation" id="calcBtn">=</button></div>
    </div>

  </div>

  <script type="module" src="src/calculator.ts"></script>
</body>

</html>
